
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก | TRPROTECT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #171717 0%, #050505 45%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  padding: 45px 20px;
}

.container {
  width: 100%;
  max-width: 440px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: bold;
  margin-bottom: 35px;
}

.brand-icon {
  color: #999;
  font-style: italic;
  font-size: 23px;
}

h1 {
  font-size: 34px;
  margin: 0 0 8px;
  font-weight: 600;
}

.subtitle {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 28px;
}

.input-box {
  position: relative;
  margin-bottom: 11px;
}

input {
  width: 100%;
  height: 50px;
  background: #101010;
  border: 1px solid #303030;
  border-radius: 14px;
  padding: 0 16px;
  color: white;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #888;
}

input::placeholder {
  color: #aaa;
}

.toggle {
  position: absolute;
  right: 16px;
  top: 16px;
  color: #777;
  cursor: pointer;
  font-size: 14px;
}

.login-link {
  display: block;
  margin: 17px 0;
  color: #ddd;
  font-size: 13px;
  text-decoration: none;
}

.login-link span {
  color: white;
  font-weight: bold;
}

.message {
  font-size: 13px;
  margin: 12px 0;
  color: #ff7777;
  overflow-wrap: anywhere;
}

button {
  width: 100%;
  height: 52px;
  margin-top: 8px;
  border: 0;
  border-radius: 13px;
  background: #aaa;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #ffffff22;
}

button:hover {
  background: #ccc;
  color: #111;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.back {
  display: block;
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-top: 22px;
  text-decoration: none;
}
</style>
  <link rel="stylesheet" href="./css/theme.css">
</head>

<body>
<div class="container">

  <div class="brand">
    <span class="brand-icon">TR</span>
    <span>TRPROTECT</span>
  </div>

  <h1>สร้างบัญชีใหม่</h1>
  <div class="subtitle">สมัครสมาชิกฟรี ใช้เวลาไม่ถึงนาที</div>

  <form id="registerForm">

    <div class="input-box">
      <input id="username" type="text"
        placeholder="ชื่อผู้ใช้" required minlength="3">
    </div>

    <div class="input-box">
      <input id="email" type="email"
        placeholder="อีเมล" required>
    </div>

    <div class="input-box">
      <input id="password" type="password"
        placeholder="รหัสผ่าน" required minlength="6">
      <span class="toggle" data-target="password">◉</span>
    </div>

    <div class="input-box">
      <input id="confirmPassword" type="password"
        placeholder="ยืนยันรหัสผ่าน" required minlength="6">
      <span class="toggle" data-target="confirmPassword">◉</span>
    </div>

    <a class="login-link" href="./login.html">
      มีบัญชีอยู่แล้ว? <span>เข้าสู่ระบบ</span>
    </a>

    <p id="message" class="message"></p>

    <button id="submitBtn" type="submit">
      สมัครสมาชิก　→
    </button>

  </form>

  <a class="back" href="./index.html">
    ← กลับหน้าหลัก
  </a>

</div>

<script type="module">
import { supabase } from "./js/supabase.js";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

document.querySelectorAll(".toggle").forEach(toggle => {
  toggle.addEventListener("click", () => {
    const input = document.getElementById(toggle.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
  });
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  message.style.color = "#ff7777";

  if (password !== confirmPassword) {
    message.textContent = "รหัสผ่านไม่ตรงกัน";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "กำลังสมัครสมาชิก...";
  message.textContent = "";

  try {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: {
          display_name: username
        }
      }
    });

    if (error) throw error;

    if (data.session) {
      message.style.color = "#75df9b";
      message.textContent = "สมัครสมาชิกสำเร็จ!";

      setTimeout(() => {
        window.location.href = "./profile.html";
      }, 1000);
    } else {
      message.style.color = "#75df9b";
      message.textContent =
        "สมัครสำเร็จ กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี";
    }

  } catch (error) {
    message.textContent = error.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "สมัครสมาชิก　→";
  }
});
</script>
</body>
</html>
