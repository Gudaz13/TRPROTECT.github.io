
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดสินค้า | TRPROTECT</title>

<link rel="stylesheet" href="./css/theme.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:18px 7%;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}

.logo span{color:#58aeff}

a{color:inherit;text-decoration:none}

.back{color:#aaa;font-size:14px}

.container{
  max-width:1100px;
  margin:35px auto;
  padding:0 18px;
}

.breadcrumb{
  color:#888;
  font-size:13px;
  margin-bottom:25px;
}

.product-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
}

.product-image{
  min-height:350px;
  background:linear-gradient(145deg,#142235,#090d14);
  border:1px solid #263f5d;
  border-radius:16px;
  display:grid;
  place-items:center;
  text-align:center;
  overflow:hidden;
}

.product-image strong{
  font-size:48px;
  letter-spacing:5px;
}

.product-image span{color:#58aeff}

.product-info h1{
  margin:0 0 12px;
  font-size:30px;
}

.description{
  color:#999;
  line-height:1.8;
}

.price{
  color:#58aeff;
  font-size:30px;
  font-weight:bold;
  margin:22px 0;
}

.stock{
  color:#58aeff;
  font-size:13px;
  margin-top:15px;
}

.buy{
  width:100%;
  padding:16px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#399dff;
  color:#07111e;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.buy:disabled{
  cursor:not-allowed;
  opacity:.55;
}

.notice{
  margin-top:15px;
  padding:16px;
  background:#111820;
  border:1px solid #263342;
  border-radius:12px;
  color:#aaa;
  font-size:13px;
  line-height:1.8;
}

.purchase-success{
  color:#66d69a;
  font-weight:bold;
  font-size:16px;
}

.history-link{
  display:block;
  margin-top:13px;
  padding:13px;
  border-radius:9px;
  background:#10243a;
  border:1px solid #399dff;
  color:#58aeff;
  text-align:center;
  font-weight:bold;
  transition:.2s;
}

.history-link:hover{
  background:#183653;
}

@media(max-width:700px){
  .product-layout{grid-template-columns:1fr}
  .product-image{min-height:250px}
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">
    TR<span>PROTECT</span>
  </a>

  <a class="back" href="index.html">
    ← กลับหน้าหลัก
  </a>
</header>

<main class="container">

  <div class="breadcrumb">
    หน้าหลัก / รายละเอียดสินค้า
  </div>

  <div class="product-layout">

    <div class="product-image" id="productImage">
      <div>
        <strong>TR<span>PROTECT</span></strong>
        <p style="color:#888">DIGITAL PRODUCT</p>
      </div>
    </div>

    <section class="product-info">

      <h1 id="productName">กำลังโหลดสินค้า...</h1>

      <p class="description" id="productDescription">
        กำลังโหลดรายละเอียด...
      </p>

      <div class="price" id="price">กำลังโหลด...</div>

      <div class="stock" id="stock">
        กำลังตรวจสอบสต็อก...
      </div>

      <button class="buy" id="buyButton" disabled>
        กำลังโหลดสินค้า...
      </button>

      <div class="notice" id="purchaseResult" aria-live="polite">
        ระบบซื้อสินค้า Sandbox
      </div>

    </section>
  </div>
</main>

<script type="module">
import { supabase } from "./js/supabase.js";

const TEST_PRODUCT_ID =
  "bf26cdb2-f556-4a7a-89ab-c4705b181775";

const params = new URLSearchParams(location.search);
const productId = params.get("id");

const nameEl = document.getElementById("productName");
const descriptionEl = document.getElementById("productDescription");
const imageEl = document.getElementById("productImage");
const priceEl = document.getElementById("price");
const stockEl = document.getElementById("stock");
const buyButton = document.getElementById("buyButton");
const resultEl = document.getElementById("purchaseResult");

let requestId = null;
let product = null;

function showMessage(message) {
  resultEl.textContent = message;
}

async function loadProduct() {

  buyButton.disabled = true;

  if (productId !== TEST_PRODUCT_ID) {
    nameEl.textContent = "สินค้านี้ไม่อยู่ในโหมดทดสอบ";

    descriptionEl.textContent =
      "หน้านี้เปิดให้ทดลองซื้อเฉพาะ TRPROTECT TEST KEY";

    stockEl.textContent = "";
    buyButton.textContent = "ไม่สามารถซื้อสินค้านี้ได้";
    return;
  }

  const { data, error } = await supabase
    .from("products")
    .select("id,name,description,price,stock,image_url,active")
    .eq("id", TEST_PRODUCT_ID)
    .eq("active", true)
    .maybeSingle();

  if (error || !data) {
    nameEl.textContent = "ไม่พบสินค้าทดสอบ";
    showMessage(error?.message || "สินค้าไม่พร้อมใช้งาน");
    return;
  }

  product = data;

  nameEl.textContent = data.name;

  descriptionEl.textContent =
    data.description || "สินค้าสำหรับทดสอบระบบเท่านั้น";

  priceEl.textContent =
    Number(data.price).toLocaleString("th-TH") + " CR";

  stockEl.textContent =
    "คงเหลือ " + data.stock + " KEY";

  if (data.image_url) {
    imageEl.replaceChildren();

    const img = document.createElement("img");
    img.src = data.image_url;
    img.alt = data.name;

    img.style.cssText =
      "width:100%;height:100%;object-fit:contain";

    imageEl.appendChild(img);
  }

  const {
    data: authData,
    error: authError
  } = await supabase.auth.getUser();

  if (authError || !authData.user) {
    buyButton.textContent = "กรุณาเข้าสู่ระบบ";
    showMessage("เข้าสู่ระบบก่อนซื้อสินค้าทดสอบ");
    return;
  }

  if (Number(data.stock) <= 0) {
    buyButton.textContent = "สินค้าหมด";
    return;
  }

  buyButton.disabled = false;
  buyButton.textContent = "ซื้อสินค้าทดสอบ";
}

function showPurchaseSuccess(order) {

  resultEl.replaceChildren();

  const success = document.createElement("div");
  success.className = "purchase-success";
  success.textContent = "✓ ซื้อสินค้าสำเร็จแล้ว";

  const balance = document.createElement("div");
  balance.textContent =
    "เครดิตคงเหลือ " +
    Number(order.remaining_balance).toLocaleString("th-TH") +
    " CR";

  balance.style.marginTop = "8px";

  const historyLink = document.createElement("a");
  historyLink.className = "history-link";
  historyLink.href = "my-orders.html";
  historyLink.textContent = "ดูประวัติการซื้อ →";

  resultEl.append(
    success,
    balance,
    historyLink
  );
}

buyButton.addEventListener("click", async () => {

  if (!product || buyButton.disabled) return;

  buyButton.disabled = true;
  buyButton.textContent = "กำลังดำเนินการ...";

  // ใช้ Request ID เดิมหากต้องส่งคำขอซ้ำ
  if (!requestId) {
    requestId = crypto.randomUUID();
  }

  showMessage("กำลังตรวจสอบเครดิตและสต็อก...");

  try {

    const { data, error } = await supabase.rpc(
      "shop_purchase_test_product",
      {
        p_request_id: requestId
      }
    );

    if (error) throw error;

    const order = Array.isArray(data) ? data[0] : data;

    if (!order || !order.order_id) {
      throw new Error("ไม่พบข้อมูลคำสั่งซื้อ");
    }

    // ซื้อสำเร็จแล้ว จึงล้าง Request ID
    requestId = null;

    // ไม่แสดง delivered_key บนหน้ารายละเอียดสินค้า
    showPurchaseSuccess(order);

    buyButton.textContent = "ซื้อสำเร็จแล้ว";

    await loadStockOnly();

  } catch (error) {

    console.error(error);

    showMessage("ซื้อไม่สำเร็จ: " + error.message);

    buyButton.disabled = false;
    buyButton.textContent = "ลองอีกครั้ง";
  }
});

async function loadStockOnly() {

  const { data, error } = await supabase
    .from("products")
    .select("stock")
    .eq("id", TEST_PRODUCT_ID)
    .maybeSingle();

  if (!error && data) {
    stockEl.textContent =
      "คงเหลือ " + data.stock + " KEY";
  }
}

loadProduct();

</script>

</body>
</html>
