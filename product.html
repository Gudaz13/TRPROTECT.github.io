
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดสินค้า | TRPROTECT</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  padding:18px 7%;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:22px;font-weight:bold;letter-spacing:2px}
.logo span{color:#f4c542}
a{color:inherit;text-decoration:none}
.back{color:#aaa;font-size:14px}
.container{max-width:1100px;margin:35px auto;padding:0 18px}
.breadcrumb{color:#888;font-size:13px;margin-bottom:25px}
.product-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
}
.product-image{
  min-height:350px;
  background:linear-gradient(145deg,#1c1c1c,#090909);
  border:1px solid #333;
  border-radius:12px;
  display:grid;
  place-items:center;
  text-align:center;
}
.product-image strong{font-size:48px;letter-spacing:5px}
.product-image span{color:#f4c542}
.product-info h1{margin:0 0 12px;font-size:30px}
.description{color:#999;line-height:1.8}
.price{
  color:#f4c542;
  font-size:30px;
  font-weight:bold;
  margin:22px 0;
}
.section-title{font-weight:bold;margin:22px 0 12px}
.packages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.package{
  padding:15px 8px;
  background:#151515;
  border:1px solid #333;
  color:white;
  border-radius:8px;
  cursor:pointer;
  text-align:center;
}
.package.active{
  border:1px solid #f4c542;
  background:#29230f;
}
.package small{display:block;color:#aaa;margin-top:7px}
.stock{color:#aaa;font-size:13px;margin-top:15px}
.buy{
  width:100%;
  padding:16px;
  margin-top:22px;
  border:0;
  border-radius:8px;
  background:#f4c542;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:not-allowed;
  opacity:.65;
}
.notice{
  margin-top:15px;
  padding:14px;
  background:#191919;
  border:1px solid #333;
  border-radius:8px;
  color:#aaa;
  font-size:13px;
  line-height:1.7;
}
@media(max-width:700px){
  .product-layout{grid-template-columns:1fr}
  .product-image{min-height:250px}
}
  .buy:enabled {
  cursor: pointer;
  opacity: 1;
}

.buy:disabled {
  cursor: not-allowed;
  opacity: .55;
}

.purchase-key {
  display: block;
  padding: 14px;
  margin-top: 10px;
  background: #101f32;
  border: 1px solid #399dff;
  border-radius: 8px;
  color: #58aeff;
  font-weight: bold;
  overflow-wrap: anywhere;
}
  
</style>
  <link rel="stylesheet" href="./css/theme.css">
</head>

<body>
<header>
  <a class="logo" href="index.html">TR<span>PROTECT</span></a>
  <a class="back" href="index.html">← กลับหน้าหลัก</a>
</header>

<main class="container">
  <div class="breadcrumb">หน้าหลัก / รายละเอียดสินค้า</div>

  <div class="product-layout">
    <div class="product-image" id="productImage">
      <div>
        <strong>TR<span>PROTECT</span></strong>
        <p style="color:#888">DIGITAL PRODUCT</p>
      </div>
    </div>

    <section class="product-info">
      <h1 id="productName">กำลังโหลดสินค้า...</h1>

<p class="description" id="productDescription">
  กำลังโหลดรายละเอียด...
</p>

      <div class="price" id="price">฿5</div>

      <div class="stock" id="stock">
  กำลังตรวจสอบสต็อก...
</div>

<button class="buy" id="buyButton" disabled>
  กำลังโหลดสินค้า...
</button>

<div class="notice" id="purchaseResult" aria-live="polite">
  ระบบซื้อสินค้า Sandbox
</div>
    </section>
  </div>
</main>

<script type="module">
import { supabase } from "./js/supabase.js";

const TEST_PRODUCT_ID =
  "bf26cdb2-f556-4a7a-89ab-c4705b181775";

const params = new URLSearchParams(location.search);
const productId = params.get("id");

const nameEl = document.getElementById("productName");
const descriptionEl = document.getElementById("productDescription");
const imageEl = document.getElementById("productImage");
const priceEl = document.getElementById("price");
const stockEl = document.getElementById("stock");
const buyButton = document.getElementById("buyButton");
const resultEl = document.getElementById("purchaseResult");

let requestId = null;
let product = null;

function showMessage(message) {
  resultEl.textContent = message;
}

async function loadProduct() {
  buyButton.disabled = true;

  if (productId !== TEST_PRODUCT_ID) {
    nameEl.textContent = "สินค้านี้ไม่อยู่ในโหมดทดสอบ";
    descriptionEl.textContent =
      "หน้านี้เปิดให้ทดลองซื้อเฉพาะ TRPROTECT TEST KEY";
    stockEl.textContent = "";
    buyButton.textContent = "ไม่สามารถซื้อสินค้านี้ได้";
    return;
  }

  const { data, error } = await supabase
    .from("products")
    .select("id,name,description,price,stock,image_url,active")
    .eq("id", TEST_PRODUCT_ID)
    .eq("active", true)
    .maybeSingle();

  if (error || !data) {
    nameEl.textContent = "ไม่พบสินค้าทดสอบ";
    showMessage(error?.message || "สินค้าไม่พร้อมใช้งาน");
    return;
  }

  product = data;

  nameEl.textContent = data.name;
  descriptionEl.textContent =
    data.description || "สินค้าสำหรับทดสอบระบบเท่านั้น";

  priceEl.textContent =
    Number(data.price).toLocaleString("th-TH") + " CR";

  stockEl.textContent = "คงเหลือ " + data.stock + " KEY";

  if (data.image_url) {
    imageEl.replaceChildren();

    const img = document.createElement("img");
    img.src = data.image_url;
    img.alt = data.name;
    img.style.cssText =
      "width:100%;height:100%;object-fit:contain";

    imageEl.appendChild(img);
  }

  const { data: authData, error: authError } =
    await supabase.auth.getUser();

  if (authError || !authData.user) {
    buyButton.textContent = "กรุณาเข้าสู่ระบบ";
    showMessage("เข้าสู่ระบบก่อนซื้อสินค้าทดสอบ");
    return;
  }

  if (Number(data.stock) <= 0) {
    buyButton.textContent = "สินค้าหมด";
    return;
  }

  buyButton.disabled = false;
  buyButton.textContent = "ซื้อสินค้าทดสอบ";
}

buyButton.addEventListener("click", async () => {
  if (!product || buyButton.disabled) return;

  buyButton.disabled = true;
  buyButton.textContent = "กำลังดำเนินการ...";

  // ใช้ Request ID เดิมเมื่อมีการลองส่งคำขอซ้ำ
  if (!requestId) {
    requestId = crypto.randomUUID();
  }

  showMessage("กำลังตรวจสอบเครดิตและสต็อก...");

  try {
    const { data, error } = await supabase.rpc(
      "shop_purchase_test_product",
      {
        p_request_id: requestId
      }
    );

    if (error) throw error;

    const order = Array.isArray(data) ? data[0] : data;

    if (!order || !order.delivered_key) {
      throw new Error("ไม่พบข้อมูล KEY ที่ส่งมอบ");
    }

    // คำขอสำเร็จแล้ว จึงล้าง Request ID
    requestId = null;

    showMessage(
      "ซื้อสำเร็จ! คงเหลือ " +
      order.remaining_balance + " CR"
    );

    const keyLabel = document.createElement("div");
    keyLabel.textContent = "KEY ที่ได้รับ";

    const keyValue = document.createElement("div");
    keyValue.className = "purchase-key";
    keyValue.textContent = order.delivered_key;

    resultEl.append(keyLabel, keyValue);

    buyButton.textContent = "ซื้อสำเร็จแล้ว";

    await loadStockOnly();

  } catch (error) {
    console.error(error);

    showMessage("ซื้อไม่สำเร็จ: " + error.message);

    buyButton.disabled = false;
    buyButton.textContent = "ลองอีกครั้ง";
  }
});

async function loadStockOnly() {
  const { data } = await supabase
    .from("products")
    .select("stock")
    .eq("id", TEST_PRODUCT_ID)
    .maybeSingle();

  if (data) {
    stockEl.textContent = "คงเหลือ " + data.stock + " KEY";
  }
}

loadProduct();
</script>
  
</script>
</body>
</html>
