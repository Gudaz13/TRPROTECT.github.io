
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ | TRPROTECT</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#080808;color:white;
 font-family:Arial,sans-serif;padding:20px
}
.card{
 width:100%;max-width:420px;padding:30px;
 background:#111;border:1px solid #292929;border-radius:18px
}
h1{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#999;margin-bottom:28px}
label{display:block;margin:15px 0 7px;font-size:13px}
input{
 width:100%;padding:13px;background:#080808;
 border:1px solid #333;border-radius:9px;color:white
}
button{
 width:100%;padding:14px;margin-top:22px;
 border:0;border-radius:9px;background:#ddd;
 color:#111;font-weight:bold;cursor:pointer
}
#message{color:#bbb;font-size:13px;text-align:center}
a{color:#ddd}
.back{text-align:center;margin-top:20px;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>TRPROTECT</h1>
<p class="sub">เข้าสู่ระบบสมาชิก</p>

<form id="loginForm">
<label>อีเมล</label>
<input id="email" type="email" required placeholder="example@email.com">

<label>รหัสผ่าน</label>
<input id="password" type="password" required placeholder="รหัสผ่าน">

<button id="submitBtn" type="submit">เข้าสู่ระบบ</button>
</form>

<p id="message"></p>
<div class="back">
ยังไม่มีบัญชี? <a href="./register.html">สมัครสมาชิก</a>
<br><br>
<a href="./index.html">กลับหน้าหลัก</a>
</div>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  message.textContent = "กำลังเข้าสู่ระบบ...";
 console.log("LOGIN BUTTON CLICKED");
console.log("Email:", email);

const { data, error } = await supabase.auth.signInWithPassword({
  email,
  password
});

console.log("LOGIN RESULT:", data);
console.log("LOGIN ERROR:", error);

  try {
    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    message.textContent = "เข้าสู่ระบบสำเร็จ!";
    window.location.href = "./profile.html";

  } catch (error) {
    message.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + error.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
