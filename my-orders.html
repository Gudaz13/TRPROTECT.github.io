
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติรายการ | TRPROTECT</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090909;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#111;
  border-bottom:1px solid #292929;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:22px;font-weight:bold}
.logo span{color:#f4c542}
a{color:inherit;text-decoration:none}
.container{max-width:1000px;margin:35px auto;padding:0 18px}
h1{font-size:27px}
.subtitle{color:#888;font-size:14px}
.order{
  background:#141414;
  border:1px solid #303030;
  border-radius:10px;
  padding:20px;
  margin-top:15px;
}
.order-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.order-name{font-weight:bold;font-size:17px}
.order-date{color:#888;font-size:12px;margin-top:8px}
.order-info{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #303030;
}
.price{color:#f4c542;font-weight:bold}
.status{color:#66d69a;font-size:13px}
.empty{
  margin-top:25px;
  padding:35px;
  text-align:center;
  background:#141414;
  border:1px solid #303030;
  border-radius:10px;
  color:#999;
}
</style>
  <link rel="stylesheet" href="./css/theme.css">
</head>

<body>
<header>
  <a class="logo" href="index.html">TR<span>PROTECT</span></a>
  <a href="profile.html" style="color:#aaa">← กลับ Profiles</a>
</header>

<main class="container">
  <h1>ประวัติรายการ</h1>
  <p class="subtitle">ตรวจสอบรายการคำสั่งซื้อของบัญชีคุณ</p>

  <div id="orders">
    <div class="empty">กำลังโหลดรายการ...</div>
  </div>
</main>

<script type="module">
import { supabase } from "./js/supabase.js";

const container = document.getElementById("orders");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

async function loadOrders() {
  const { data: { user }, error: authError } =
    await supabase.auth.getUser();

  if (authError || !user) {
    container.innerHTML =
      '<div class="empty">กรุณาเข้าสู่ระบบก่อนดูประวัติรายการ</div>';
    return;
  }

  const { data, error } = await supabase
    .from("shop_orders")
    .select("id,amount_paid,status,created_at,products(name)")
    .eq("user_id", user.id)
    .order("created_at", { ascending:false });

  if (error) {
    console.error(error);
    container.innerHTML =
      '<div class="empty">ไม่สามารถโหลดประวัติได้ กรุณาตรวจสอบสิทธิ์ฐานข้อมูล</div>';
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML =
      '<div class="empty">ยังไม่มีประวัติรายการ</div>';
    return;
  }

  container.innerHTML = data.map(order => {
    const date = new Date(order.created_at)
      .toLocaleString("th-TH");

    return `
      <article class="order">
        <div class="order-top">
          <div>
            <div class="order-name">
              ${escapeHTML(order.products?.name || "สินค้า")}
            </div>
            <div class="order-date">
              ${escapeHTML(date)}
            </div>
          </div>
          <span class="status">
            ${escapeHTML(order.status)}
          </span>
        </div>

        <div class="order-info">
          <span style="color:#999">รหัสรายการ</span>
          <span>${escapeHTML(order.id.slice(0,8))}</span>
        </div>

        <div class="order-info">
          <span style="color:#999">ยอดที่ใช้</span>
          <span class="price">
            ฿${Number(order.amount_paid).toLocaleString("th-TH")}
          </span>
        </div>
      </article>
    `;
  }).join("");
}

loadOrders();
</script>
</body>
</html>
