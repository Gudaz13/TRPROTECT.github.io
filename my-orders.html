<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติรายการ | TRPROTECT</title>

<link rel="stylesheet" href="./css/theme.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07090d;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  background:#101318;
  border-bottom:1px solid #252d38;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{color:#399dff}

a{color:inherit;text-decoration:none}

.container{
  max-width:1000px;
  margin:35px auto;
  padding:0 18px;
}

h1{font-size:27px}

.subtitle{
  color:#8995a5;
  font-size:14px;
}

.order{
  background:#111820;
  border:1px solid #263342;
  border-radius:13px;
  padding:20px;
  margin-top:15px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.order-name{
  font-weight:bold;
  font-size:17px;
}

.order-date{
  color:#8995a5;
  font-size:12px;
  margin-top:8px;
}

.order-info{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #263342;
}

.price{
  color:#58aeff;
  font-weight:bold;
}

.status{
  color:#66d69a;
  font-size:13px;
}

.key-box{
  margin-top:18px;
  padding:16px;
  background:#080e17;
  border:1px solid #28517a;
  border-radius:10px;
}

.key-label{
  color:#58aeff;
  font-size:13px;
  margin-bottom:10px;
}

.key-value{
  display:block;
  color:#fff;
  font-size:15px;
  line-height:1.7;
  overflow-wrap:anywhere;
  user-select:all;
}

.empty{
  margin-top:25px;
  padding:35px;
  text-align:center;
  background:#111820;
  border:1px solid #263342;
  border-radius:12px;
  color:#8995a5;
}

@media(max-width:600px){
  header{padding:16px 18px}
  .container{margin:25px auto}
  .order{padding:16px}
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">
    TR<span>PROTECT</span>
  </a>

  <a href="profile.html" style="color:#8995a5">
    ← กลับ Profiles
  </a>
</header>

<main class="container">

  <h1>ประวัติรายการ</h1>
  <p class="subtitle">
    ตรวจสอบรายการคำสั่งซื้อและ TEST KEY ของบัญชีคุณ
  </p>

  <div id="orders">
    <div class="empty">กำลังโหลดรายการ...</div>
  </div>

</main>

<script type="module">
import { supabase } from "./js/supabase.js";

const container = document.getElementById("orders");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function formatDate(value) {
  return new Date(value).toLocaleString("th-TH", {
    dateStyle:"medium",
    timeStyle:"short"
  });
}

async function loadOrders() {

  container.innerHTML =
    '<div class="empty">กำลังโหลดรายการ...</div>';

  const {
    data: { user },
    error: authError
  } = await supabase.auth.getUser();

  if (authError || !user) {
    container.innerHTML =
      '<div class="empty">กรุณาเข้าสู่ระบบก่อนดูประวัติรายการ</div>';
    return;
  }

  const { data, error } = await supabase.rpc(
    "shop_my_test_orders"
  );

  if (error) {
    console.error("Load orders error:", error);

    container.innerHTML =
      '<div class="empty">ไม่สามารถโหลดประวัติได้ กรุณาตรวจสอบ RPC ใน Supabase</div>';

    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML =
      '<div class="empty">ยังไม่มีประวัติการซื้อ TEST KEY</div>';
    return;
  }

  container.innerHTML = data.map(order => {

    const date = formatDate(order.purchased_at);

    return `
      <article class="order">

        <div class="order-top">
          <div>
            <div class="order-name">
              ${escapeHTML(order.product_name)}
            </div>

            <div class="order-date">
              ${escapeHTML(date)}
            </div>
          </div>

          <span class="status">สำเร็จ</span>
        </div>

        <div class="order-info">
          <span style="color:#8995a5">
            รหัสรายการ
          </span>

          <span>
            ${escapeHTML(order.order_id.slice(0,8))}
          </span>
        </div>

        <div class="order-info">
          <span style="color:#8995a5">
            เครดิตที่ใช้
          </span>

          <span class="price">
            ${Number(order.amount_paid).toLocaleString("th-TH")} CR
          </span>
        </div>

        <div class="key-box">
          <div class="key-label">
            TEST KEY ที่ได้รับ
          </div>

          <code class="key-value">${escapeHTML(order.delivered_key || "ไม่พบ KEY")}</code>
        </div>

      </article>
    `;
  }).join("");
}

loadOrders();
</script>

</body>
</html>
